<!doctype html>
<html lang="en">
<head>

<link rel="icon" href="/web/logo.svg" type="image/svg+xml">

<body>
<main class="admin nights">
    <header class="top">
        <h1 class="brand-title"><img src="/web/logo.svg" alt=""> Movie nights</h1>
        <a class="button" href="/">‹ My room</a>
    </header>
    <p class="muted">Upcoming scheduled nights from every host. Schedule your own from your room's Invite box. To join someone else's, ask them for the link and password.</p>

    <ol id="nights" class="night-list"></ol>
    <p id="none" class="empty" hidden>Nothing scheduled yet.</p>
</main>
