# Coolify-ready: every ${VAR} shows up in Coolify's Environment Variables tab (":?" = required).
# Plain Docker: put the values in a .env file next to this one; see docker-compose.example.yml for a port mapping.
services:
  bloom:
    build: .
    restart: unless-stopped
    environment:
      # Coolify domain: leave PUBLIC_URL empty and set the domain on the service (fills SERVICE_FQDN_BLOOM_8080).
      # Own proxy (Pangolin, nginx...): set PUBLIC_URL to the public address, e.g. https://bloom.example.com
      SERVICE_FQDN_BLOOM_8080:
      PUBLIC_URL: ${PUBLIC_URL:-${SERVICE_FQDN_BLOOM_8080}}
      JELLYFIN_URL: ${JELLYFIN_URL:?Jellyfin address, e.g. http://jellyfin:8096}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:?Jellyfin Dashboard > API Keys}
      JELLYFIN_USER_ID: ${JELLYFIN_USER_ID:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      JELLYSEERR_URL: ${JELLYSEERR_URL:-}
      JELLYSEERR_API_KEY: ${JELLYSEERR_API_KEY:-}
    # for a proxy outside Docker (Pangolin's Newt, nginx): http://<server>:HOST_PORT
    ports:
      - "${HOST_PORT:-8765}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    # login sessions live in the volume; everything else in memory
    volumes:
      - bloom-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  bloom-data:
