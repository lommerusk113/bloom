# Coolify-ready: every ${VAR} shows up in Coolify's Environment Variables tab (":?" = required).
# Plain Docker: put the values in a .env file next to this one; see docker-compose.example.yml for a port mapping.
services:
  bloom:
    build: .
    restart: unless-stopped
    environment:
      # Coolify generates the domain and routes it to port 8080
      SERVICE_FQDN_BLOOM_8080:
      PUBLIC_URL: ${SERVICE_FQDN_BLOOM_8080}
      JELLYFIN_URL: ${JELLYFIN_URL:?Jellyfin address, e.g. http://jellyfin:8096}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:?Jellyfin Dashboard > API Keys}
      HOST_PASSWORD: ${HOST_PASSWORD:?Password for the host page}
      JELLYFIN_USER_ID: ${JELLYFIN_USER_ID:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    # nothing is written to disk; all state lives in memory
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
